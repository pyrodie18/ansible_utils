name: Publish collection

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/pyrodie18-utils-venv
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.15"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Verify lock and sync
        run: |
          uv lock --check
          uv sync --frozen --group dev
      - name: Build collection
        run: uv run --frozen ansible-galaxy collection build --output-path dist
      - name: Publish collection
        env:
          ANSIBLE_GALAXY_API_KEY: ${{ secrets.ANSIBLE_GALAXY_API }}
        run: uv run --frozen ansible-galaxy collection publish dist/pyrodie18-utils-*.tar.gz --api-key "$ANSIBLE_GALAXY_API_KEY"
